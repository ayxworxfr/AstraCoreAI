llm:
  default_profile: deepseek-chat
  profiles:
    - id: claude-sonnet
      label: Claude Sonnet
      protocol: anthropic
      base_url: https://anyrouter.top
      api_key_env: ANTHROPIC_PROXY_API_KEY
      model: claude-sonnet-4-6
      extra_headers:
        anthropic-beta: context-1m-2025-08-07
      max_tokens: 16384

    - id: claude-opus
      label: Claude Opus
      protocol: anthropic
      base_url: https://anyrouter.top
      api_key_env: ANTHROPIC_PROXY_API_KEY
      model: claude-opus-4-7
      extra_headers:
        anthropic-beta: context-1m-2025-08-07
      max_tokens: 16384

    - id: deepseek-chat
      label: DeepSeek Chat
      protocol: anthropic
      base_url: https://api.deepseek.com/anthropic
      api_key_env: DEEPSEEK_API_KEY
      model: deepseek-v4-flash
      max_tokens: 16384

    - id: gpt-5-5
      label: GPT-5.5
      protocol: responses
      base_url: https://anyrouter.top/v1
      api_key_env: ANTHROPIC_PROXY_API_KEY
      model: gpt-5.5
      max_tokens: 16384

    - id: glm-5-1
      label: GLM 5.1
      protocol: openai
      base_url: https://llm-proxy.oa.com/private/v1
      api_key_env: ANTHROPIC_PROXY_API_KEY
      model: glm-5.1
      max_tokens: 16384

agent:
  max_tool_result_chars: 20000
  max_tool_iterations: 8
  tool_timeout_s: 60
  enable_spawn_agents: false

memory:
  redis_url: redis://localhost:6379/0
  db_url: sqlite+aiosqlite:///./astracore.db

retrieval:
  # 设为 false 可完全关闭 RAG 功能（不注册 /api/v1/rag 路由，不加载向量模型）
  enabled: true
  collection_name: astracore
  persist_directory: ./chroma_db
  # embedding_model: all-MiniLM-L6-v2          # 默认，英文场景，~90MB
  embedding_model: paraphrase-multilingual-MiniLM-L12-v2  # 中文/多语言场景，~420MB

mcp:
  servers:
    - type: filesystem
      paths:
        - ~/develope

    - type: shell
      allow_dirs:
        - ~/develope

debug:
  log_prompts: false
