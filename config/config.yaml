llm:
  default_profile: gpt-5-5
  profiles:
    - id: claude-sonnet
      label: Claude Sonnet
      provider: anthropic
      base_url: https://anyrouter.top
      api_key_env: ANTHROPIC_PROXY_API_KEY
      extra_headers:
        anthropic-beta: context-1m-2025-08-07
      model: claude-sonnet-4-6
      max_tokens: 16384

    - id: claude-opus
      label: Claude Opus
      provider: anthropic
      base_url: https://anyrouter.top
      api_key_env: ANTHROPIC_PROXY_API_KEY
      extra_headers:
        anthropic-beta: context-1m-2025-08-07
      model: claude-opus-4-7
      max_tokens: 16384

    - id: deepseek-chat
      label: DeepSeek Chat
      provider: anthropic
      base_url: https://api.deepseek.com/anthropic
      api_key_env: DEEPSEEK_API_KEY
      model: deepseek-chat
      max_tokens: 16384

    - id: gpt-5-5
      label: GPT-5.5
      provider: openai
      base_url: https://anyrouter.top/v1
      api_key_env: ANTHROPIC_PROXY_API_KEY
      api_type: responses
      model: gpt-5.5
      max_tokens: 16384

    - id: glm-5-1
      label: GLM 5.1
      provider: deepseek
      base_url: https://llm-proxy.oa.com/private/v1
      api_key_env: ANTHROPIC_PROXY_API_KEY
      model: glm-5.1
      max_tokens: 16384

agent:
  max_tool_result_chars: 20000
  max_tool_iterations: 0
  tool_timeout_s: 60
  enable_spawn_agents: false

memory:
  redis_url: redis://localhost:6379/0
  db_url: sqlite+aiosqlite:///./astracore.db

retrieval:
  collection_name: astracore
  persist_directory: ./chroma_db
  # embedding_model: all-MiniLM-L6-v2          # 默认，英文场景
  embedding_model: paraphrase-multilingual-MiniLM-L12-v2  # 中文/多语言场景

skill_routing:
  mode: vector                  # off | vector | llm
  # vector 模式参数（需要 sentence-transformers，模型由 retrieval.embedding_model 统一配置）
  threshold: 0.45            # 主技能最低相似度
  secondary_threshold: 0.35  # 副技能最低相似度
  max_skills: 3              # 同时加载的最大技能数
  # llm 模式参数
  # llm_profile: claude-sonnet  # 不填则使用 default_profile

mcp:
  servers:
    - type: filesystem
      paths:
        - ~/develope

    - type: shell
      allow_dirs:
        - ~/develope
