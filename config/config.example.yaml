llm:
  default_profile: claude-sonnet
  profiles:
    - id: claude-sonnet
      label: Claude Sonnet
      protocol: anthropic
      base_url: https://api.anthropic.com
      api_key_env: ANTHROPIC_API_KEY
      model: claude-sonnet-4-6
      max_tokens: 8192
      # 采样参数（可选）
      # top_p: 0.9              # 核采样概率截断，与 temperature 二选一；null = 使用 provider 默认值
      # stop_sequences: []      # 强终止序列，最多 4 条
      enable_prompt_cache: true # 为 system prompt 注入 cache_control，降低 Anthropic 输入 token 成本
      # 推理控制（可选）
      # thinking_mode: off      # 'off' | 'on' | 'adaptive'（adaptive 仅 Opus 4.7+ 支持）
      # thinking_budget: 8000   # thinking_mode='on' 时的 token 预算（≥1000）
      # 运维覆盖（可选）
      # timeout_s: 60           # 覆盖全局 policy.timeout.llm_timeout_s（秒）
      # max_retries: 3          # 覆盖全局 policy.retry.max_retries
      # service_tier: standard  # Anthropic: 'priority' | 'standard' | 'batch'

    - id: deepseek-v4-flash
      label: DeepSeek Chat
      protocol: openai
      base_url: https://api.deepseek.com
      api_key_env: DEEPSEEK_API_KEY
      model: deepseek-v4-flash
      max_tokens: 8192
      # service_tier: auto      # OpenAI: 'auto' | 'default' | 'flex'

    - id: gpt-5-5
      label: GPT-5.5
      protocol: responses
      base_url: https://anyrouter.top/v1
      api_key_env: ANTHROPIC_PROXY_API_KEY
      model: gpt-5.5
      max_tokens: 8192
      # 推理控制（Responses API 专属）
      # reasoning_effort: medium  # 'minimal' | 'low' | 'medium' | 'high'；null = provider 默认 medium
      # verbosity: medium         # 'low' | 'medium' | 'high'；null = provider 默认 medium
      # service_tier: auto        # OpenAI: 'auto' | 'default' | 'flex'

# 全局 policy 配置
# retry / timeout 字段可在 llm.profiles[].timeout_s / max_retries 中按 profile 单独覆盖。
policy:
  retry:
    max_retries: 3                              # 总重试次数（不含首次）
    retry_on_status_codes: [429, 500, 502, 503, 504]
    # initial_delay_ms: 1000                   # 首次重试等待（毫秒）
    # max_delay_ms: 30000                      # 指数退避上限（毫秒）
    # exponential_base: 2.0                    # 退避底数
  timeout:
    llm_timeout_s: 180                         # LLM 调用超时（秒）；Claude 长输出建议调高至 240
    tool_timeout_s: 120                        # 工具执行超时（秒，0 = 不限制）
    retrieval_timeout_s: 10                    # RAG 检索超时（秒）
  compaction:
    context_window_tokens: 200000              # 估算上下文窗口
    trigger_ratio: 0.5                         # 估算 token 超过 window*ratio 时压缩
    compact_batch_ratio: 0.6                   # 单次压缩最旧 60% 消息
    chars_per_token: 0.6                       # 字符到 token 的近似换算（中英混合）
    default_max_messages: 10                   # 未设置 user_settings.context_max_messages 时兜底

agent:
  max_tool_result_chars: 20000
  max_tool_iterations: 10
  enable_spawn_agents: true

# Human-in-the-Loop 配置
hitl:
  enabled: true                         # 总开关；false 时禁用所有 HITL 交互
  inline_question_timeout: 300          # 等待用户回复的超时秒数，超时后自动继续
  require_tool_approval: true           # true 时 requires_confirmation=True 的工具暂停等待用户审批
  require_memory_promotion_approval: true  # true 时记忆晋升（session→user/project）需用户确认

# 认证配置
auth:
  secret_key: change-me-in-production   # 生产环境必须替换为强随机字符串
  token_expire_days: 30                 # JWT token 有效期（天）
  allow_registration: true              # false 时关闭注册接口（首个用户注册后建议关闭）

storage:
  db_url: sqlite+aiosqlite:///./astracore.db
  redis_url: redis://localhost:6379/0
  vector:
    # 设为 false 可完全关闭 RAG 功能（不注册 /api/v1/rag 路由，不加载向量模型）
    # enabled: false
    collection_name: astracore
    persist_directory: ./chroma_db
    # embedding_model: all-MiniLM-L6-v2          # 默认，英文场景，~90MB
    # embedding_model: paraphrase-multilingual-MiniLM-L12-v2  # 中文/多语言场景，~420MB

skills:
  extra_dirs: []             # 额外的 skill 目录，支持绝对路径或 ~/xxx
  #  - D:/my-skills
  #  - ~/shared-skills

# 开发者调试配置
debug:
  log_prompts: false         # true 时在每次 LLM 调用前把完整提示词（system prompt + 消息列表）打印到 stdout

mcp:
  servers:
    - type: filesystem
      paths:
        - D:/project

    - type: shell
      allow_dirs:
        - D:/project
      timeout: 30
