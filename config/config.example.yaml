llm:
  default_profile: claude-sonnet
  profiles:
    - id: claude-sonnet
      label: Claude Sonnet
      protocol: anthropic
      base_url: https://api.anthropic.com
      api_key_env: ANTHROPIC_API_KEY
      model: claude-sonnet-4-6
      max_tokens: 8192

    - id: deepseek-v4-flash
      label: DeepSeek Chat
      protocol: openai
      base_url: https://api.deepseek.com
      api_key_env: DEEPSEEK_API_KEY
      model: deepseek-v4-flash
      max_tokens: 8192

    - id: gpt-5-5
      label: GPT-5.5
      protocol: responses
      base_url: https://anyrouter.top/v1
      api_key_env: ANTHROPIC_PROXY_API_KEY
      model: gpt-5.5
      max_tokens: 8192

agent:
  max_tool_result_chars: 20000
  max_tool_iterations: 10
  tool_timeout_s: 120
  enable_spawn_agents: true

memory:
  redis_url: redis://localhost:6379/0
  db_url: sqlite+aiosqlite:///./astracore.db

retrieval:
  collection_name: astracore
  persist_directory: ./chroma_db
  # embedding_model: all-MiniLM-L6-v2          # 默认，英文场景
  # embedding_model: paraphrase-multilingual-MiniLM-L12-v2  # 中文/多语言场景

skills:
  extra_dirs: []             # 额外的 skill 目录，支持绝对路径或 ~/xxx
  #  - D:/my-skills
  #  - ~/shared-skills

mcp:
  servers:
    - type: filesystem
      paths:
        - D:/project

    - type: shell
      allow_dirs:
        - D:/project
      timeout: 30
