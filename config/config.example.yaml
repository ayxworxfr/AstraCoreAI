llm:
  default_profile: claude-sonnet
  profiles:
    - id: claude-sonnet
      label: Claude Sonnet
      provider: anthropic
      base_url: https://api.anthropic.com
      api_key_env: ANTHROPIC_API_KEY
      model: claude-sonnet-4-6
      max_tokens: 8192

    - id: deepseek-v4-flash
      label: DeepSeek Chat
      provider: deepseek
      base_url: https://api.deepseek.com
      api_key_env: DEEPSEEK_API_KEY
      model: deepseek-v4-flash
      max_tokens: 8192

agent:
  max_tool_result_chars: 20000
  max_tool_iterations: 10
  tool_timeout_s: 120
  enable_spawn_agents: true

memory:
  redis_url: redis://localhost:6379/0
  db_url: sqlite+aiosqlite:///./astracore.db

retrieval:
  collection_name: astracore
  persist_directory: ./chroma_db
  # embedding_model: all-MiniLM-L6-v2          # 默认，英文场景
  # embedding_model: paraphrase-multilingual-MiniLM-L12-v2  # 中文/多语言场景

skills:
  extra_dirs: []             # 额外的 skill 目录，支持绝对路径或 ~/xxx
  #  - D:/my-skills
  #  - ~/shared-skills

skill_routing:
  mode: off                  # off | vector | llm
  # vector 模式参数（需要 sentence-transformers，模型由 retrieval.embedding_model 统一配置）
  threshold: 0.45            # 主技能最低相似度（0~1）
  secondary_threshold: 0.35  # 副技能最低相似度
  max_skills: 3              # 同时加载的最大技能数
  # llm 模式参数
  # llm_profile: claude-sonnet  # 不填则使用 llm.default_profile

mcp:
  servers:
    - type: filesystem
      paths:
        - D:/project

    - type: shell
      allow_dirs:
        - D:/project
      timeout: 30
