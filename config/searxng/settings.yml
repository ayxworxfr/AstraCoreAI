# SearXNG minimal configuration for AstraCoreAI.
# 只继承当前部署环境验证可用的默认引擎，避免不可达/反爬引擎在启动或搜索时反复报错。
# 可选引擎参考：
# - bing：优先推荐，英文搜索质量好；当前镜像/地区页面解析为 0 条结果，升级镜像或配置代理后可再试。
# - baidu：国内可用性较好，当前环境实测可返回结果；英文搜索质量一般。
# - 360search：国内可用性较好，当前环境实测可返回结果；结果偏中文，质量不如 Bing。
# - duckduckgo web：隐私友好，国外通用搜索；当前环境容易超时。
# - qwant：欧洲通用搜索；当前环境容易超时。
# - yahoo：国外通用搜索；当前环境容易超时。
# - google / startpage / brave / wikipedia / wikidata：质量或覆盖面好，但当前网络不可达、超时或启动初始化失败。
# 修改时同步替换 use_default_settings.engines.keep_only 和下方 engines 列表。
use_default_settings:
  engines:
    keep_only:
      - baidu

general:
  instance_name: "AstraCore Search"
  debug: false

server:
  # 生产部署前务必替换为强随机字符串
  secret_key: "change-me-in-production"
  # 内部使用，关闭限速
  limiter: false
  public_instance: false

search:
  # 必须开启 json 格式，否则 /search?format=json 返回 403
  formats:
    - html
    - json

engines:
  # Bing 在当前 SearXNG 镜像中返回 0 条结果，改用 Baidu。
  - name: baidu
    disabled: false
