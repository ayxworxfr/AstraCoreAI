services:
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  app:
    build:
      context: .
      args:
        PIP_INDEX_URL: ${PIP_INDEX_URL:-https://pypi.org/simple}
    restart: unless-stopped
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      ASTRACORE_CONFIG: "/app/config/config.docker.yaml"
    volumes:
      - astracore_data:/app/data
    depends_on:
      redis:
        condition: service_healthy

volumes:
  astracore_data:
